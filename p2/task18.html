<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
</head>

<body style="text-align:center; font-family:Arial; background:#f2f2f2;">
    <h1>Library Management System</h1>
    <div style="width:440px; margin:auto;">
        <div style="width:180px; height:180px; background:lightblue; display:inline-block; margin:10px; vertical-align:top;">
            <img src="images/books.png" alt="Books" width="120" height="120" style="margin-top:10px;"><br><br>
            <b>Books</b>
        </div>

        <div style="width:180px; height:180px; background:lightgreen; display:inline-block; margin:10px; vertical-align:top;">
            <img src="images/members.png" alt="Members" width="120" height="120" style="margin-top:10px;"><br><br>
            <b>Members</b>
        </div>

        <div style="width:180px; height:180px; background:lightyellow; display:inline-block; margin:10px; vertical-align:top;">
            <img src="images/issue.png" alt="Issue Books" width="120" height="120" style="margin-top:10px;"><br><br>
            <b>Issue Books</b>
        </div>

        <div style="width:180px; height:180px; background:lightcoral; display:inline-block; margin:10px; vertical-align:top;">
            <img src="images/digital.png" alt="Digital Library" width="120" height="120" style="margin-top:10px;"><br><br>
            <b>Digital Library</b>
        </div>
    </div>
</body>
</html>
