<!DOCTYPE html>
<html>
<head>
    <title>Smart Search Engine</title>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c3e50;
            padding: 15px 25px;
        }

        .title {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .search-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input,select,button {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid gray;
            font-size: 15px;
        }

        input {
            width: 260px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #1f6fb2;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="title">
            Smart Search Engine
        </div>

        <div class="search-area">

            <input type="text"
                placeholder="Search products, services, or articles...">

            <select>
                <option>All Categories</option>
                <option>Electronics</option>
                <option>Books</option>
                <option>Clothing</option>
                <option>Groceries</option>
            </select>

            <select>
                <option>Any Price</option>
                <option>Under ₹500</option>
                <option>₹500 – ₹2,000</option>
                <option>Above ₹2,000</option>
            </select>

            <button>Search</button>

        </div>

    </div>

</body>

</html>
