<!DOCTYPE html>
<html>

<head>
    <title>GameZone</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: #1b1b1b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 30px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .menu a:hover {
            color: orange;
        }

        .play-btn {
            background: orange;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .play-btn:hover {
            background: darkorange;
        }

        .banner {
            margin-top: 70px;
            height: 70vh;
            background-image: url("images/gamezone.png");
            background-size: cover;
            background-position: center;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;
        }

        .banner h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .banner p {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .banner button {
            padding: 12px 28px;
            background: orange;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .banner button:hover {
            background: darkorange;
        }
    </style>

</head>

<body>

    <div class="header">

        <div class="logo">
            GameZone
        </div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">Tournaments</a>
            <a href="#">News</a>
            <a href="#">Contact</a>
        </div>

        <button class="play-btn">
            Play Now
        </button>

    </div>

    <div class="banner">

        <h1>Level Up Your Gaming Experience</h1>

        <p>Join exciting tournaments and explore the latest games.</p>

        <button>Explore Games</button>

    </div>

</body>

</html>
