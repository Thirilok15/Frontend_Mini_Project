<!DOCTYPE html>
<html>
<head>
    <title>Product Search</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f7ff;
        }

        #searchBox {
            width: 300px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #2563eb;
            border-radius: 8px;
            outline: none;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #1e40af;
        }
    </style>
</head>

<body>

    <h2>Product Search</h2>

    <input type="text" id="searchBox" placeholder="Enter product name">

    <p id="disp"></p>

    <p id="result"></p>

    
    <script>
        const searchBox = document.getElementById("searchBox");
        const result = document.getElementById("result");

        searchBox.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                result.textContent = "Searching for: " + searchBox.value;
            }
            else{
                disp.textContent = searchBox.value + event.key;
                searchBox.style.backgroundColor = "#dbeafe";
            }
        });
    </script>

</body>
</html>
