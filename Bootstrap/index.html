<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Authentication</title>

    <!-- Local Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>User Authentication</h1>
        <p>College Events 2026</p>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">College Events</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Gallery</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Authentication Section -->
    <main class="container auth-section">

        <div class="row justify-content-center g-4">

            <!-- Login Box -->
            <div class="col-md-5">
                <div class="auth-box">

                    <h2>Login</h2>
                    <p class="text-muted">
                        Login to your account
                    </p>

                    <form>

                        <div class="mb-3">
                            <label for="loginUser" class="form-label">
                                Username / Email
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="loginUser"
                                   placeholder="Enter username or email">
                        </div>

                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="loginPassword"
                                   placeholder="Enter password">
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                </div>
            </div>


            <!-- Registration Box -->
            <div class="col-md-5">
                <div class="auth-box">

                    <h2>Register</h2>
                    <p class="text-muted">
                        Create a new account
                    </p>

                    <form>

                        <div class="mb-3">
                            <label for="fullName" class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="fullName"
                                   placeholder="Enter full name">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   placeholder="Enter email">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   placeholder="Enter password">
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="confirmPassword"
                                   placeholder="Confirm password">
                        </div>

                        <button type="submit"
                                class="btn btn-success w-100">
                            Register
                        </button>

                    </form>

                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 College Events</p>
    </footer>

</body>
</html>
